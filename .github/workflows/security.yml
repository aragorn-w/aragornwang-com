name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Sunday 06:00 UTC, staggered from refresh-github-cache.yml (Mon 07:00 UTC)
    - cron: '0 6 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default least-privilege; override per job if needed.
permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Required for analyze to upload SARIF to code scanning. The repo went
      # public in 2026-08, which makes code scanning free, so findings can go
      # to the Security tab instead of living only in this job's log.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          # Default 'security' suite. No security-extended/quality —
          # too noisy for a 3000-LOC static Astro site.

      - name: Analyze (upload to code scanning, keep local SARIF)
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          upload: 'always'
          # Keep writing SARIF locally too: the gate below is the enforcement,
          # the upload is only for visibility. analyze writes this directory
          # before uploading, so the gate reads the same bytes either way.
          output: codeql-results

      # Deliberately kept after switching on the upload. The upload gives
      # history and PR annotations; THIS step is what blocks a finding from
      # reaching main, and it stays strict (any finding fails the job).
      - name: Fail on CodeQL findings
        run: |
          set -euo pipefail
          SARIF=$(find codeql-results -name '*.sarif' -print -quit)
          if [ -z "$SARIF" ]; then
            echo "::error::No CodeQL SARIF output found"
            exit 1
          fi
          COUNT=$(jq '[.runs[].results[]] | length' "$SARIF")
          echo "CodeQL findings: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            jq -r '
              .runs[].results[] |
              "[\(.level // "warning")] \(.ruleId): \(.message.text) — \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine // 0)"
            ' "$SARIF"
            exit 1
          fi

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Action enumerates commits on the PR via /pulls/:n/commits, which requires this.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '1'
          ignore-unfixed: true

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep@sha256:326e5f41cc972bb423b764a14febbb62bbad29ee1c01820805d077dd868fea48 # 1.161.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        # `semgrep ci` exits non-zero on findings. Rules limited to JS/TS/secrets;
        # OWASP-top-ten suite excluded (SQLi/SSRF/auth rules irrelevant for static site).
        run: semgrep ci
        env:
          SEMGREP_RULES: p/javascript p/typescript p/secrets

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Audit (high+, with .nsprc allowlist)
        # better-npm-audit reads .nsprc for advisory allowlist with reasons.
        # Pinned via devDependencies + lockfile so the scanner version and
        # integrity hash are reproducible run-to-run; no `@latest` fetch.
        run: npx --no-install better-npm-audit audit --level high
