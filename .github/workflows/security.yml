name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Sunday 06:00 UTC, staggered from refresh-github-cache.yml (Mon 07:00 UTC)
    - cron: '0 6 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default least-privilege; override per job if needed.
permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: javascript-typescript
          # Default 'security' suite. No security-extended/quality —
          # too noisy for a 3000-LOC static Astro site.

      - name: Analyze (no upload, private repo without GHAS)
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          upload: 'never'
          output: codeql-results

      - name: Fail on CodeQL findings
        run: |
          set -euo pipefail
          SARIF=$(find codeql-results -name '*.sarif' -print -quit)
          if [ -z "$SARIF" ]; then
            echo "::error::No CodeQL SARIF output found"
            exit 1
          fi
          COUNT=$(jq '[.runs[].results[]] | length' "$SARIF")
          echo "CodeQL findings: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            jq -r '
              .runs[].results[] |
              "[\(.level // "warning")] \(.ruleId): \(.message.text) — \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine // 0)"
            ' "$SARIF"
            exit 1
          fi

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Action enumerates commits on the PR via /pulls/:n/commits, which requires this.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '1'
          ignore-unfixed: true

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep@sha256:326e5f41cc972bb423b764a14febbb62bbad29ee1c01820805d077dd868fea48 # 1.161.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        # `semgrep ci` exits non-zero on findings. Rules limited to JS/TS/secrets;
        # OWASP-top-ten suite excluded (SQLi/SSRF/auth rules irrelevant for static site).
        run: semgrep ci
        env:
          SEMGREP_RULES: p/javascript p/typescript p/secrets

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Audit (high+, with .nsprc allowlist)
        # better-npm-audit reads .nsprc for advisory allowlist with reasons.
        # Pinned via devDependencies + lockfile so the scanner version and
        # integrity hash are reproducible run-to-run; no `@latest` fetch.
        run: npx --no-install better-npm-audit audit --level high
