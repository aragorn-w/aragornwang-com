name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily 06:00 UTC, staggered from refresh-github-cache.yml (Mon 07:00 UTC).
    # The whole-tree npm audit and Trivy scans run only on push to main, this
    # schedule and manual dispatch, so main is rechecked against the advisory
    # databases every day rather than every week (at each job's own severity
    # floor; Trivy also skips findings with no fixed version).
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default least-privilege; override per job if needed.
permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Required for analyze to upload SARIF to code scanning. The repo went
      # public on 2026-06-14, which makes code scanning free, so findings can
      # go to the Security tab instead of living only in this job's log.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          # GitHub's default query suite. Not security-extended or
          # security-and-quality: too noisy for a small static Astro site.

      - name: Analyze (upload to code scanning, keep local SARIF)
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: 'always'
          # Keep writing SARIF locally too: the gate below is the enforcement,
          # the upload is only for visibility. analyze writes this directory
          # before uploading, so the gate reads the same bytes either way.
          output: codeql-results

      # Deliberately kept after switching on the upload. The upload gives
      # history and PR annotations; THIS step is what blocks a finding from
      # reaching main, and it stays strict (any finding fails the job).
      - name: Fail on CodeQL findings
        run: |
          set -euo pipefail
          SARIF=$(find codeql-results -name '*.sarif' -print -quit)
          if [ -z "$SARIF" ]; then
            echo "::error::No CodeQL SARIF output found"
            exit 1
          fi
          COUNT=$(jq '[.runs[].results[]] | length' "$SARIF")
          echo "CodeQL findings: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            jq -r '
              .runs[].results[] |
              "[\(.level // "warning")] \(.ruleId): \(.message.text) — \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine // 0)"
            ' "$SARIF"
            exit 1
          fi

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Action enumerates commits on the PR via /pulls/:n/commits, which requires this.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    # The action diffs the PR's base and head dependency graphs, so it needs PR
    # refs. On every other event this job is skipped.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # No checkout: without a local config file the action reads the
      # dependency graph through the API.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fails only on vulnerable versions this PR adds or changes to
          # (GitHub Advisory Database), so an advisory against a dependency
          # already on main no longer blocks unrelated PRs or the PR that
          # fixes it. `moderate` matches Trivy's MEDIUM floor. The default
          # scope is runtime only; development and unknown are included
          # because the build runs dev dependencies.
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown

  trivy:
    name: Trivy
    # Trivy and npm audit scan the whole lockfile. On PRs, one new advisory
    # against any existing dependency (at or above a scanner's severity floor,
    # and for Trivy one with a fixed version) failed every PR, the per-package
    # Dependabot fix PRs included, since each left the other findings in
    # place. The Dependency review job gates PRs instead. A job skipped by an
    # `if` reports Success, so both stay required checks.
    # They run on push to main, the daily schedule and workflow_dispatch;
    # "Run workflow" on a branch scans that branch before merging (for
    # example after editing .nsprc).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '1'
          ignore-unfixed: true

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep@sha256:326e5f41cc972bb423b764a14febbb62bbad29ee1c01820805d077dd868fea48 # 1.161.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        # `semgrep ci` exits non-zero on findings. Rules limited to JS/TS/secrets;
        # OWASP-top-ten suite excluded (SQLi/SSRF/auth rules irrelevant for static site).
        run: semgrep ci
        env:
          SEMGREP_RULES: p/javascript p/typescript p/secrets

  audit:
    name: npm audit
    # Skipped on PRs for the same reason as the Trivy job (see the comment there).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # check-latest: see the comment on the check job's Set up Node step in ci.yml.
          node-version: '24'
          check-latest: true
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Audit (high+, with .nsprc allowlist)
        # better-npm-audit reads .nsprc for advisory allowlist with reasons.
        # Pinned via devDependencies + lockfile so the scanner version and
        # integrity hash are reproducible run-to-run; no `@latest` fetch.
        run: npx --no-install better-npm-audit audit --level high
