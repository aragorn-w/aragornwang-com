name: Refresh GitHub cache

on:
  schedule:
    # Mondays at 07:00 UTC (midnight PT / 01:00 MT).
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-github-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Refresh cache
        run: node scripts/refresh-github-cache.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open auto-merging PR if changed
        # main is branch-protected (PR + checks required), so we cannot push
        # directly. Create a branch + PR + enable auto-merge so the cache
        # refresh lands once the security pipeline passes on the new commit.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain src/data/github-cache.json)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          BRANCH="auto/refresh-github-cache-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add src/data/github-cache.json
          git commit -m "Refresh GitHub cache"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main --head "$BRANCH" \
            --title "Refresh GitHub cache" \
            --body "Automated weekly refresh of \`src/data/github-cache.json\`. Auto-merges when checks pass."
          gh pr merge "$BRANCH" --auto --squash --delete-branch
