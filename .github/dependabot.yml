version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    # Two majors are deliberately held, so Dependabot should stop re-raising
    # them every week. Both were tested, not assumed, and both are recorded in
    # the PRs that rejected them. Only MAJOR updates are ignored: patches and
    # minors within the current major still come through, and removing an entry
    # here is the deliberate act of taking the upgrade.
    ignore:
      # eslint-plugin-astro 3.x pulls astro-eslint-parser requiring
      # node ^22.22.3 || ^24.16.0 || >=26.3.0, while this repo declares
      # engines.node >=22.12.0. The original parser bug that caused the pin is
      # fixed; the blocker now is that adopting 3.x would silently break anyone
      # on Node 22.12-22.22.2 while package.json still promises them support.
      # Take it together with raising the Node floor, not before.
      - dependency-name: eslint-plugin-astro
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # github/codeql-action is pinned at two subpaths (init and analyze) which
    # MUST move together: init writes its version into the serialized config
    # and analyze throws "Loaded a configuration file for version X, but
    # running version Y" on a mismatch. Ungrouped, Dependabot raises one PR per
    # subpath, so whichever merges first breaks the CodeQL job. That happened
    # for v4.37.7 (#82, #83) and again for v4.38.0 (#102, #103).
    #
    # Scoped to codeql-action rather than a catch-all "*" deliberately: a
    # catch-all would bundle unrelated action bumps into one PR, so a single
    # bad upgrade would block the rest and be harder to isolate. It is the only
    # action here pinned at more than one subpath. Add another entry if that
    # changes. No update-types filter, so majors move together too.
    groups:
      codeql:
        patterns:
          - 'github/codeql-action/*'
